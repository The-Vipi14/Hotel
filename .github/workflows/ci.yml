name: CI

on:
  push:
    branches:
      - main
      - local

  pull_request:
    branches:
      - main

jobs:
  admin-ui:
    name: Admin UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-UI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Admin UI
        run: npm run build


  frontend-ui:
    name: Frontend UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-UI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend UI
        run: npm run build


  server:
    name: Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Server
        run: npm run build --if-present